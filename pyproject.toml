[project]
name = "myna"
version = "0.1.0"
description = "Myna API"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "plotly",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "jinja2"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PT", "C4", "RUF100"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

[tool.vercel]
entrypoint = "src.adapters.api.router:app"
